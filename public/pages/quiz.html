<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GlowCare • Skin Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>

<body>
    <div class="d-flex">
        <aside class="sidebar p-3">
            <div class="brand fs-4 mb-1">GlowCare</div>
            <div class="small-muted mb-3">Skincare, simplified.</div>

            <nav class="d-grid gap-1">
                <a id="navHome" class="navlink" href="/pages/home.html">Home</a>
                <a id="navCatalog" class="navlink" href="/pages/catalog.html">Catalog</a>
                <a id="navWishlist" class="navlink" href="/pages/wishlist.html">Wishlist</a>
                <a id="navCart" class="navlink" href="/pages/cart.html">Cart</a>
                <a id="navQuiz" class="navlink active" href="/pages/quiz.html">Skin Quiz</a>
                <a id="navProfile" class="navlink" href="/pages/profile.html">Profile</a>
            </nav>

            <button id="btnLogout" class="btn btn-outline-danger w-100 mt-3">Logout</button>
        </aside>

        <main class="main flex-grow-1">
            <div class="container" style="max-width: 1100px;">
                <div class="d-flex align-items-end justify-content-between mb-3">
                    <div>
                        <h2 class="mb-1">Skin Quiz</h2>
                    </div>
                </div>

                <div class="card-soft p-4">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Skin type</label>
                            <select id="skinType" class="form-select">
                                <option value="">Select</option>
                                <option value="oily">Oily</option>
                                <option value="dry">Dry</option>
                                <option value="combination">Combination</option>
                                <option value="normal">Normal</option>
                                <option value="sensitive">Sensitive</option>
                            </select>
                        </div>

                        <div class="col-12 rowline pt-3">
                            <div class="fw-semibold mb-2">Concerns (choose at least 1)</div>
                            <div class="row g-2">
                                <div class="col-md-4"><label class="navlink"><input class="form-check-input me-2"
                                            type="checkbox" name="concerns" value="acne">acne</label></div>
                                <div class="col-md-4"><label class="navlink"><input class="form-check-input me-2"
                                            type="checkbox" name="concerns" value="redness">redness</label></div>
                                <div class="col-md-4"><label class="navlink"><input class="form-check-input me-2"
                                            type="checkbox" name="concerns" value="dryness">dryness</label></div>
                                <div class="col-md-4"><label class="navlink"><input class="form-check-input me-2"
                                            type="checkbox" name="concerns" value="pores">pores</label></div>
                                <div class="col-md-4"><label class="navlink"><input class="form-check-input me-2"
                                            type="checkbox" name="concerns" value="pigmentation">pigmentation</label>
                                </div>
                                <div class="col-md-4"><label class="navlink"><input class="form-check-input me-2"
                                            type="checkbox" name="concerns" value="wrinkles">wrinkles</label></div>
                            </div>
                        </div>

                        <div class="col-12 rowline pt-3">
                            <div class="fw-semibold mb-2">Preferences (optional)</div>
                            <div class="row g-2">
                                <div class="col-md-4"><label class="navlink"><input class="form-check-input me-2"
                                            type="checkbox" name="preferences"
                                            value="fragrance-free">fragrance-free</label></div>
                                <div class="col-md-4"><label class="navlink"><input class="form-check-input me-2"
                                            type="checkbox" name="preferences" value="vegan">vegan</label></div>
                                <div class="col-md-4"><label class="navlink"><input class="form-check-input me-2"
                                            type="checkbox" name="preferences" value="cruelty-free">cruelty-free</label>
                                </div>
                            </div>
                        </div>

                        <div class="col-12">
                            <button id="btnSave" class="btn btn-accent text-white mt-2" style="max-width:180px;">Save
                                quiz</button>
                            <div id="msg" class="small mt-2"></div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/quiz.js"></script>
</body>

</html>
