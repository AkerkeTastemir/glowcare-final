<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GlowCare • Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>

<body>
    <div class="d-flex">
        <aside class="sidebar p-3">
            <div class="brand fs-4 mb-1">GlowCare</div>
            <div class="small-muted mb-3">Skincare, simplified.</div>

            <nav class="d-grid gap-1">
                <a id="navHome" class="navlink" href="/pages/home.html">Home</a>
                <a id="navCatalog" class="navlink" href="/pages/catalog.html">Catalog</a>
                <a id="navWishlist" class="navlink" href="/pages/wishlist.html">Wishlist</a>
                <a id="navCart" class="navlink" href="/pages/cart.html">Cart</a>
                <a id="navQuiz" class="navlink" href="/pages/quiz.html">Skin Quiz</a>
                <a id="navProfile" class="navlink active" href="/pages/profile.html">Profile</a>
            </nav>

            <button id="btnLogout" class="btn btn-outline-danger w-100 mt-3">Logout</button>
        </aside>

        <main class="main flex-grow-1">
            <div class="container" style="max-width: 1100px;">
                <div class="d-flex align-items-end justify-content-between mb-3">
                    <div>
                        <h2 class="mb-1">My Profile</h2>
                    </div>
                </div>

                <div class="card-soft p-4">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="small-muted">Email</div>
                            <div id="email" class="fw-semibold"></div>
                        </div>
                        <div class="col-md-6">
                            <div class="small-muted">Role</div>
                            <div id="role" class="fw-semibold"></div>
                        </div>

                        <div class="col-12 rowline pt-3">
                            <label class="form-label">Username</label>
                            <input id="username" class="form-control" placeholder="username">
                            <div class="d-flex gap-2 mt-3">
                                <button id="btnSave" class="btn btn-accent text-white"
                                    style="max-width:160px;">Save</button>
                                <a class="btn btn-outline-dark" href="/pages/quiz.html">Update Quiz</a>
                            </div>
                            <div id="msg" class="small mt-2"></div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/profile.js"></script>
</body>

</html>
