<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GlowCare • Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="d-flex">
  <aside class="sidebar p-3">
    <div class="brand fs-4 mb-2">GlowCare</div>
    <div class="small-muted mb-3">Skincare, simplified.</div>

    <nav class="d-grid gap-1">
      <a id="navHome" class="navlink active" href="/pages/home.html">Home</a>
      <a id="navCatalog" class="navlink" href="/pages/catalog.html">Catalog</a>
      <a id="navWishlist" class="navlink" href="/pages/wishlist.html">Wishlist</a>
      <a id="navCart" class="navlink" href="/pages/cart.html">Cart</a>
      <a id="navQuiz" class="navlink" href="/pages/quiz.html">Skin Quiz</a>
      <a id="navProfile" class="navlink" href="/pages/profile.html">Profile</a>
    </nav>

    <button id="btnLogout" class="btn btn-outline-danger w-100 mt-3">Logout</button>
  </aside>

  <main class="main flex-grow-1">
    <div class="container" style="max-width: 1100px;">
      <div class="d-flex align-items-end justify-content-between mb-3">
        <div>
          <h2 class="mb-1">Home</h2>
          <div class="small-muted">Recommendations + new arrivals</div>
        </div>
        <div class="kbd">GET /api/user/quiz/recommendations</div>
      </div>

      <div class="card-soft p-4 mb-4">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h4 class="mb-1">Your Recommendations</h4>
            <div class="small-muted">Based on your quiz</div>
          </div>
          <a class="btn btn-outline-dark" href="/pages/quiz.html">Update quiz</a>
        </div>

        <div id="recMsg" class="small text-danger mt-2"></div>
        <div id="recGrid" class="grid mt-3"></div>
      </div>

      <div class="card-soft p-4">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h4 class="mb-1">New Arrivals</h4>
            <div class="small-muted">Latest products</div>
          </div>
          <a class="btn btn-outline-dark" href="/pages/catalog.html">View all</a>
        </div>

        <div id="newGrid" class="grid mt-3"></div>
      </div>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/home.js"></script>
</body>
</html>
