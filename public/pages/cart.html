<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GlowCare • Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="d-flex">
  <aside class="sidebar p-3">
    <div class="brand fs-4 mb-2">GlowCare</div>
    <div class="small-muted mb-3">Skincare, simplified.</div>

    <nav class="d-grid gap-1">
      <a id="navHome" class="navlink" href="/pages/home.html">Home</a>
      <a id="navCatalog" class="navlink" href="/pages/catalog.html">Catalog</a>
      <a id="navWishlist" class="navlink" href="/pages/wishlist.html">Wishlist</a>
      <a id="navCart" class="navlink active" href="/pages/cart.html">Cart</a>
      <a id="navQuiz" class="navlink" href="/pages/quiz.html">Skin Quiz</a>
      <a id="navProfile" class="navlink" href="/pages/profile.html">Profile</a>
    </nav>

    <button id="btnLogout" class="btn btn-outline-danger w-100 mt-3">Logout</button>
  </aside>

  <main class="main flex-grow-1">
    <div class="container" style="max-width: 1100px;">
      <div class="d-flex align-items-end justify-content-between mb-3">
        <div>
          <h2 class="mb-1">Cart</h2>
          <div class="small-muted">Checkout uses advanced updates ($inc)</div>
        </div>
        <div class="kbd">POST /api/orders/checkout</div>
      </div>

      <div class="card-soft p-4">
        <h4 class="mb-3">Items</h4>
        <div id="cartMsg" class="small text-danger mb-2"></div>
        <div id="cartList"></div>
        <div class="rowline mt-3 pt-3 d-flex justify-content-between">
          <div class="fw-semibold">Total</div>
          <div class="fw-semibold" id="total">$0.00</div>
        </div>
        <div class="d-flex gap-2 mt-3">
          <button id="btnCheckout" class="btn btn-accent text-white">Checkout</button>
          <button id="btnClear" class="btn btn-outline-dark">Clear</button>
        </div>
        <div id="checkoutMsg" class="small mt-2"></div>
      </div>

    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/cart.js"></script>
</body>
</html>
